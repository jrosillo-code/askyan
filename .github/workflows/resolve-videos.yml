name: resolve-videos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -uo pipefail
          : > resolved-videos.txt
          check() { code=$(curl -s -o /dev/null --max-time 25 -w '%{http_code}' -A "Mozilla/5.0" "$1"); echo "$code $1" >> resolved-videos.txt; }
          check "https://videos.pexels.com/video-files/8761030/8761030-hd_1920_1080_30fps.mp4"
          check "https://videos.pexels.com/video-files/8774553/8774553-hd_1920_1080_30fps.mp4"
          check "https://videos.pexels.com/video-files/7593088/7593088-hd_1920_927_30fps.mp4"
          check "https://videos.pexels.com/video-files/7593088/7593088-hd_1920_1080_30fps.mp4"
          check "https://videos.pexels.com/video-files/3121327/3121327-hd_1920_1080_24fps.mp4"
          check "https://videos.pexels.com/video-files/28878868/12502190_1920_1080_60fps.mp4"
          check "https://videos.pexels.com/video-files/18830352/18830352-hd_1920_1080_60fps.mp4"
          check "https://videos.pexels.com/video-files/18830352/18830352-hd_2560_1440_60fps.mp4"
          cat resolved-videos.txt
          git config user.name "video-resolve"; git config user.email "actions@users.noreply.github.com"
          git add resolved-videos.txt && git commit -m "HD variant availability" && git push
