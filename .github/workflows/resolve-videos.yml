# One-shot: resolve Pexels download-redirect URLs to their direct CDN file
# URLs (the dev sandbox can't follow them; the runner can).
name: resolve-videos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          : > resolved-videos.txt
          for id in 8761030 3059046 28878868 7593088 3121327 14862479; do
            url=$(curl -sIL -o /dev/null --max-time 40 -w '%{url_effective}' -A "Mozilla/5.0" "https://www.pexels.com/download/video/$id/")
            echo "$id $url" >> resolved-videos.txt
          done
          cat resolved-videos.txt
          git config user.name "video-resolve"; git config user.email "actions@users.noreply.github.com"
          git add resolved-videos.txt && git commit -m "Resolved direct video URLs" && git push
