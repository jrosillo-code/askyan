name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live API
        run: |
          echo "=== POST /api/chat ==="
          curl -sS -o /tmp/r.json -w "HTTP %{http_code}\n" \
            -X POST https://askyan.vercel.app/api/chat \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"Which expeditions do you run?"}]}' || true
          cat /tmp/r.json; echo
          echo "=== GET /api/subscribers (no key; expect 401/503 JSON) ==="
          curl -sS -o /tmp/r2.json -w "HTTP %{http_code}\n" https://askyan.vercel.app/api/subscribers || true
          cat /tmp/r2.json; echo
          echo "=== POST /api/subscribe (DB path) ==="
          curl -sS -o /tmp/r3.json -w "HTTP %{http_code}\n" \
            -X POST https://askyan.vercel.app/api/subscribe \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-probe@example.com"}' || true
          cat /tmp/r3.json; echo
      - name: Probe pages
        run: |
          echo "=== GET /contact (follow redirects, show chain) ==="
          curl -sS -o /dev/null -L --max-redirs 5 -w "final=%{url_effective} status=%{http_code} redirects=%{num_redirects}\n" https://askyan.vercel.app/contact || true
          echo "=== GET /expedition/mongolia-gobi (prerendered title) ==="
          curl -sSL https://askyan.vercel.app/expedition/mongolia-gobi | grep -o "<title>[^<]*</title>" || true
          echo "=== GET / ==="
          curl -sS -o /dev/null -w "status=%{http_code}\n" https://askyan.vercel.app/ || true
